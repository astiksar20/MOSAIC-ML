# MOSAIC-ML - one command to run the whole application locally.
#
#   docker compose up --build
#
# Then open http://localhost:7860 - the dashboard and the API are served from
# that single port, exactly as they are when deployed.
#
# Scan history persists in the named volume below, so it survives
# `docker compose down` (unlike a deployed container, whose filesystem is
# ephemeral - see DEPLOY.md).

services:
  mosaic:
    build: .
    image: mosaic-ml:latest
    container_name: mosaic-ml
    ports:
      - "7860:7860"
    environment:
      # The dashboard is served from the same origin as the API, so CORS is
      # not exercised in this setup. Listed anyway for a separate frontend.
      ALLOWED_ORIGINS: "http://localhost:7860,http://127.0.0.1:7860"
      MAX_UPLOAD_MB: "150"
      # Raises the NVD limit from 5 to 50 requests / 30s.
      # Put the real key in a .env file beside this one; do not commit it.
      NVD_API_KEY: "${NVD_API_KEY:-}"
      # Leave unset for SQLite. Point at Neon/Supabase for durable history.
      DATABASE_URL: "${DATABASE_URL:-}"
    volumes:
      - mosaic-data:/app/db
    restart: unless-stopped

volumes:
  mosaic-data:
